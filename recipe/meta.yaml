{% set name = "typing_inspect" %}
{% set version = "0.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b23fc42ff6f6ef6954e4852c1fb512cdd18dbea03134f91f856a95ccc9461f78

build:
  number: 0
  skip: true  # [py<36]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - mypy_extensions >=0.3.0
    - typing_extensions >=3.7.4.2

test:
  imports:
    - typing_inspect
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/ilevkivskyi/typing_inspect
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: Runtime inspection utilities for Python typing module
  description: |
    The typing_inspect module defines experimental API for runtime inspection of types defined in the Python standard typing module.
  dev_url: https://github.com/ilevkivskyi/typing_inspect
  doc_url: https://github.com/ilevkivskyi/typing_inspect 

extra:
  recipe-maintainers:
    - tarcisioe
